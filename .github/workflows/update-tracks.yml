# ─────────────────────────────────────────────────────────────
#  Ehsaas — Auto Track Update
#
#  Triggers whenever you push ANY file to the main branch.
#  GitHub automatically:
#    1. Runs generate_tracks.py  →  updates tracks.json
#    2. Commits tracks.json back to the repo
#    3. GitHub Pages re-deploys  →  website is updated
#
#  YOU only need to:
#    git add yourSong.mp3
#    git commit -m "add song"
#    git push
#  That's it. Nothing else.
# ─────────────────────────────────────────────────────────────

name: Auto-update tracks.json

on:
  push:
    branches:
      - main          # fires on every push to main
    paths:
      - 'audio/**'    # only when something in audio/ changes

  # Also allows manual trigger from GitHub website
  workflow_dispatch:

jobs:
  update-tracks:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit tracks.json back

    steps:
      # 1. Download your repo files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Run the scanner (Python 3 is pre-installed on GitHub runners)
      - name: Generate tracks.json
        run: python3 generate_tracks.py

      # 3. Commit the updated tracks.json back to the repo
      - name: Commit tracks.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracks.json
          # Only commit if tracks.json actually changed
          git diff --staged --quiet || git commit -m "auto: update tracks.json"
          git push
